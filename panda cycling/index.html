<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panda Cycling in Kuala Lumpur — SVG Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f111a;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 1100px;
      background: #181b28;
      border: 1px solid #2a2f45;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group p {
      font-size: 0.82rem;
      color: #9ca3af;
      margin-top: 2px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .btn-group {
      display: inline-flex;
      background: #0f111a;
      border: 1px solid #2a2f45;
      border-radius: 10px;
      padding: 3px;
    }
    button {
      background: transparent;
      color: #9ca3af;
      border: none;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      color: #ffffff;
    }
    button.active {
      background: #3b82f6;
      color: #ffffff;
    }
    .bell-btn {
      background: #0f111a;
      color: #f3f4f6;
      border: 1px solid #2a2f45;
      border-radius: 10px;
      padding: 7px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .bell-btn:hover {
      background: #23283c;
      border-color: #3b82f6;
    }
    .bell-btn:active {
      transform: scale(0.96);
    }
    .viewport {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2f45;
    }

    /* Parallax & Character Animations */
    @keyframes scrollFar {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes scrollMid {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes scrollNear {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes scrollClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes monorailMove {
      0% { transform: translateX(1350px); }
      100% { transform: translateX(-550px); }
    }
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes bikeBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pandaTorsoBob {
      0%, 100% { transform: rotate(10deg) translateY(0px); }
      50% { transform: rotate(12.5deg) translateY(-4px); }
    }
    @keyframes pandaHeadNod {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      50% { transform: rotate(3deg) translateY(-3px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes speedLine {
      0% { transform: translateX(0); opacity: 0.85; }
      100% { transform: translateX(-180px); opacity: 0; }
    }
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes frontLegThigh {
      0%   { transform: rotate(-15deg); }
      25%  { transform: rotate(10deg); }
      50%  { transform: rotate(28deg); }
      75%  { transform: rotate(2deg); }
      100% { transform: rotate(-15deg); }
    }
    @keyframes frontLegCalf {
      0%   { transform: rotate(25deg); }
      25%  { transform: rotate(55deg); }
      50%  { transform: rotate(15deg); }
      75%  { transform: rotate(5deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes backLegThigh {
      0%   { transform: rotate(28deg); }
      25%  { transform: rotate(2deg); }
      50%  { transform: rotate(-15deg); }
      75%  { transform: rotate(10deg); }
      100% { transform: rotate(28deg); }
    }
    @keyframes backLegCalf {
      0%   { transform: rotate(15deg); }
      25%  { transform: rotate(5deg); }
      50%  { transform: rotate(25deg); }
      75%  { transform: rotate(55deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes bellRingWave {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    #kl-svg {
      --speed-mult: 1;
      width: 100%;
      height: auto;
      display: block;
    }
    .clouds-track { animation: scrollClouds calc(65s / var(--speed-mult)) linear infinite; }
    .skyline-far { animation: scrollFar calc(38s / var(--speed-mult)) linear infinite; }
    .skyline-mid { animation: scrollMid calc(18s / var(--speed-mult)) linear infinite; }
    .street-near { animation: scrollNear calc(4.2s / var(--speed-mult)) linear infinite; }
    .monorail-train { animation: monorailMove calc(14s / var(--speed-mult)) linear infinite; }
    .spin { animation: spinWheel calc(1.1s / var(--speed-mult)) linear infinite; }
    .bike-rig { animation: bikeBounce calc(0.55s / var(--speed-mult)) ease-in-out infinite; }
    .panda-torso { animation: pandaTorsoBob calc(0.55s / var(--speed-mult)) ease-in-out infinite; }
    .panda-head { animation: pandaHeadNod calc(0.55s / var(--speed-mult)) ease-in-out infinite; }
    .panda-eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    .panda-ear { animation: earWiggle calc(0.55s / var(--speed-mult)) ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .beacon-pulse { animation: beaconPulse 1.6s ease-in-out infinite; }
    .leg-front-thigh { animation: frontLegThigh calc(1.1s / var(--speed-mult)) linear infinite; }
    .leg-front-calf { animation: frontLegCalf calc(1.1s / var(--speed-mult)) linear infinite; }
    .leg-back-thigh { animation: backLegThigh calc(1.1s / var(--speed-mult)) linear infinite; }
    .leg-back-calf { animation: backLegCalf calc(1.1s / var(--speed-mult)) linear infinite; }
    .wind-1 { animation: speedLine calc(0.9s / var(--speed-mult)) linear infinite; }
    .wind-2 { animation: speedLine calc(1.2s / var(--speed-mult)) linear infinite 0.3s; }
    .wind-3 { animation: speedLine calc(0.75s / var(--speed-mult)) linear infinite 0.5s; }
    .bell-wave-active { animation: bellRingWave 0.6s ease-out forwards; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div class="title-group">
        <h1>🐼 Panda Cycling in Kuala Lumpur</h1>
        <p>Featuring Merdeka 118, Petronas Twin Towers, Menara KL, Sultan Abdul Samad &amp; KL Monorail</p>
      </div>

      <div class="controls">
        <div class="btn-group">
          <button onclick="setThemeMode('sunset')" id="btn-sunset" class="active">Sunset</button>
          <button onclick="setThemeMode('day')" id="btn-day">Day</button>
          <button onclick="setThemeMode('night')" id="btn-night">Night</button>
        </div>

        <div class="btn-group">
          <button onclick="setSpeed(0.6, 'chill')" id="spd-chill">Chill</button>
          <button onclick="setSpeed(1, 'cruise')" id="spd-cruise" class="active">Cruise</button>
          <button onclick="setSpeed(1.85, 'sprint')" id="spd-sprint">Sprint ⚡</button>
        </div>

        <button onclick="ringBell()" class="bell-btn">
          <span>🔔</span>
          <span>Ring Bell</span>
        </button>
      </div>
    </div>

    <div class="viewport">
      <svg id="kl-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
        <defs>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop id="sky-stop-1" offset="0%" stop-color="#1a1c4b" />
            <stop id="sky-stop-2" offset="35%" stop-color="#3b2d64" />
            <stop id="sky-stop-3" offset="68%" stop-color="#9e4770" />
            <stop id="sky-stop-4" offset="88%" stop-color="#f2855d" />
            <stop id="sky-stop-5" offset="100%" stop-color="#fbd07c" />
          </linearGradient>

          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6b7" stop-opacity="1" />
            <stop offset="40%" stop-color="#ffaa5c" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#f2855d" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="petronasGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7ec8e3" />
            <stop offset="30%" stop-color="#d4f1f9" />
            <stop offset="55%" stop-color="#9be0f7" />
            <stop offset="100%" stop-color="#4a90b8" />
          </linearGradient>

          <linearGradient id="merdekaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#64b5f6" />
            <stop offset="50%" stop-color="#283593" />
            <stop offset="100%" stop-color="#1a237e" />
          </linearGradient>

          <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2b2d3c" />
            <stop offset="100%" stop-color="#181924" />
          </linearGradient>

          <linearGradient id="bikeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5252" />
            <stop offset="100%" stop-color="#c62828" />
          </linearGradient>

          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <g id="petronas-tower">
            <rect x="-28" y="190" width="56" height="230" fill="url(#petronasGrad)" stroke="#376e96" stroke-width="1" />
            <rect x="-24" y="140" width="48" height="50" fill="url(#petronasGrad)" stroke="#376e96" stroke-width="1" />
            <rect x="-19" y="100" width="38" height="40" fill="url(#petronasGrad)" stroke="#376e96" stroke-width="1" />
            <rect x="-14" y="70" width="28" height="30" fill="url(#petronasGrad)" stroke="#376e96" stroke-width="1" />
            <polygon points="-14,70 14,70 8,48 -8,48" fill="#d4f1f9" stroke="#376e96" stroke-width="1" />
            <rect x="-4" y="25" width="8" height="23" fill="#e0f7fa" />
            <line x1="0" y1="-12" x2="0" y2="25" stroke="#ffffff" stroke-width="2.5" />
            <circle cx="0" cy="4" r="3.5" fill="#ffffff" />
            <circle cx="0" cy="-12" r="3.5" fill="#ff5252" class="beacon-pulse" filter="url(#glow)" />
            <g stroke="#2c5d82" stroke-width="1" opacity="0.55">
              <line x1="-28" y1="205" x2="28" y2="205" />
              <line x1="-28" y1="220" x2="28" y2="220" />
              <line x1="-28" y1="235" x2="28" y2="235" />
              <line x1="-28" y1="250" x2="28" y2="250" />
              <line x1="-28" y1="265" x2="28" y2="265" />
              <line x1="-28" y1="280" x2="28" y2="280" />
              <line x1="-28" y1="295" x2="28" y2="295" />
              <line x1="-28" y1="310" x2="28" y2="310" />
              <line x1="-28" y1="325" x2="28" y2="325" />
              <line x1="-28" y1="340" x2="28" y2="340" />
              <line x1="-28" y1="355" x2="28" y2="355" />
              <line x1="-28" y1="370" x2="28" y2="370" />
              <line x1="-24" y1="155" x2="24" y2="155" />
              <line x1="-24" y1="170" x2="24" y2="170" />
              <line x1="-19" y1="115" x2="19" y2="115" />
              <line x1="-19" y1="130" x2="19" y2="130" />
              <line x1="-14" y1="85" x2="14" y2="85" />
            </g>
            <line x1="-12" y1="70" x2="-12" y2="420" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
            <line x1="0" y1="70" x2="0" y2="420" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
            <line x1="12" y1="70" x2="12" y2="420" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
          </g>

          <g id="palm-tree">
            <path d="M0,0 Q-6,-45 4,-90" fill="none" stroke="#4e342e" stroke-width="7" stroke-linecap="round" />
            <g transform="translate(4, -90)">
              <path d="M0,0 Q-35,-15 -50,10 Q-25,2 0,0" fill="#2e7d32" />
              <path d="M0,0 Q-25,-35 -45,-20 Q-20,-12 0,0" fill="#388e3c" />
              <path d="M0,0 Q0,-45 15,-38 Q5,-18 0,0" fill="#43a047" />
              <path d="M0,0 Q35,-30 50,-10 Q25,-8 0,0" fill="#2e7d32" />
              <path d="M0,0 Q38,-5 48,20 Q22,6 0,0" fill="#1b5e20" />
              <circle cx="-3" cy="4" r="4" fill="#5d4037" />
              <circle cx="4" cy="5" r="4" fill="#4e342e" />
            </g>
          </g>

          <g id="bike-wheel">
            <circle cx="0" cy="0" r="46" fill="none" stroke="#1e2029" stroke-width="8" />
            <circle cx="0" cy="0" r="40" fill="none" stroke="#cfd8dc" stroke-width="3" />
            <circle cx="0" cy="0" r="38" fill="none" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="18 22" />
            <g stroke="#b0bec5" stroke-width="1.5">
              <line x1="-38" y1="0" x2="38" y2="0" />
              <line x1="0" y1="-38" x2="0" y2="38" />
              <line x1="-27" y1="-27" x2="27" y2="27" />
              <line x1="-27" y1="27" x2="27" y2="-27" />
              <line x1="-35" y1="-15" x2="35" y2="15" />
              <line x1="-15" y1="35" x2="15" y2="-35" />
              <line x1="-35" y1="15" x2="35" y2="-15" />
              <line x1="-15" y1="-35" x2="15" y2="35" />
            </g>
            <circle cx="0" cy="0" r="7" fill="#455a64" stroke="#eceff1" stroke-width="2" />
          </g>
        </defs>

        <!-- 1. SKY BACKGROUND & CELESTIAL BODY -->
        <rect width="1200" height="600" fill="url(#skyGrad)" />
        <g id="celestial-group">
          <circle id="sun-halo" cx="880" cy="285" r="185" fill="url(#sunGlow)" />
          <circle id="sun-disc" cx="880" cy="285" r="58" fill="#fff3b0" opacity="0.92" />
        </g>

        <g id="stars-layer" fill="#ffffff" opacity="0.75">
          <circle cx="120" cy="42" r="1.5" />
          <circle cx="280" cy="70" r="2" />
          <circle cx="450" cy="35" r="1.2" />
          <circle cx="620" cy="62" r="1.8" />
          <circle cx="790" cy="40" r="1.5" />
          <circle cx="960" cy="55" r="2" />
          <circle cx="1110" cy="30" r="1.4" />
          <circle cx="190" cy="105" r="1.2" />
          <circle cx="530" cy="95" r="1.5" />
        </g>

        <!-- 2. CLOUDS LAYER -->
        <g class="clouds-track" opacity="0.45" fill="#ffd8be" id="clouds-color">
          <g id="cloud-set">
            <path d="M120,135 Q140,115 170,120 Q195,100 225,120 Q250,120 260,140 Z" />
            <path d="M520,95 Q545,70 580,80 Q610,60 645,80 Q675,80 685,103 Z" />
            <path d="M920,150 Q940,130 975,135 Q1000,120 1030,137 Q1050,137 1060,155 Z" />
          </g>
          <use href="#cloud-set" x="1200" />
        </g>

        <!-- 3. FAR PARALLAX LAYER: KL SKYLINE -->
        <g class="skyline-far">
          <g id="kl-skyline-slice">
            <path d="M0,420 L0,340 L45,340 L45,300 L95,300 L95,350 L130,350 L130,275 L185,275 L185,335 L260,335 L260,290 L315,290 L315,360 L490,360 L490,310 L545,310 L545,345 L690,345 L690,280 L745,280 L745,340 L860,340 L860,295 L915,295 L915,335 L1035,335 L1035,265 L1095,265 L1095,325 L1150,325 L1150,350 L1200,350 L1200,420 Z" fill="#2c2250" opacity="0.85" />

            <!-- MERDEKA 118 -->
            <g transform="translate(215, 0)">
              <polygon points="18,95 24,10 28,95" fill="#90caf9" />
              <circle cx="24" cy="10" r="3" fill="#ff5252" class="beacon-pulse" filter="url(#glow)" />
              <polygon points="-28,420 -22,135 18,95 32,125 36,420" fill="url(#merdekaGrad)" stroke="#64b5f6" stroke-width="1" />
              <polyline points="-22,135 8,220 -25,340" fill="none" stroke="#90caf9" stroke-width="1.5" opacity="0.7" />
              <polyline points="18,95 8,220 34,320" fill="none" stroke="#90caf9" stroke-width="1.5" opacity="0.7" />
              <line x1="8" y1="220" x2="8" y2="420" stroke="#bbdefb" stroke-width="1.2" opacity="0.5" />
            </g>

            <!-- PETRONAS TWIN TOWERS -->
            <g transform="translate(410, 0)">
              <use href="#petronas-tower" x="-52" y="0" />
              <use href="#petronas-tower" x="52" y="0" />
              <rect x="-24" y="226" width="48" height="11" fill="#e0f7fa" stroke="#2c5d82" stroke-width="1" />
              <line x1="-24" y1="231.5" x2="24" y2="231.5" stroke="#2c5d82" stroke-width="1.2" />
              <line x1="-24" y1="262" x2="-4" y2="237" stroke="#9be0f7" stroke-width="3" />
              <line x1="24" y1="262" x2="4" y2="237" stroke="#9be0f7" stroke-width="3" />
            </g>

            <!-- KL TOWER (MENARA KL) -->
            <g transform="translate(795, 0)">
              <line x1="0" y1="20" x2="0" y2="92" stroke="#e0f2f1" stroke-width="3" />
              <circle cx="0" cy="20" r="3" fill="#ff5252" class="beacon-pulse" filter="url(#glow)" />
              <ellipse cx="0" cy="112" rx="26" ry="16" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2" />
              <rect x="-25" y="107" width="50" height="7" rx="3" fill="#4fc3f7" />
              <polygon points="-16,126 16,126 10,142 -10,142" fill="#90a4ae" />
              <polygon points="-7,142 7,142 13,420 -13,420" fill="#eceff1" stroke="#78909c" stroke-width="1" />

            <!-- THE EXCHANGE 106 (TRX) -->
            <g transform="translate(990, 0)">
              <rect x="-26" y="155" width="52" height="265" fill="#283593" stroke="#5c6bc0" stroke-width="1" />
              <polygon points="-26,155 26,155 18,118 -18,118" fill="#81d4fa" opacity="0.9" filter="url(#glow)" />
              <polygon points="-18,118 18,118 0,102" fill="#e1f5fe" />
              <line x1="-13" y1="155" x2="-13" y2="420" stroke="#7986cb" stroke-width="1" opacity="0.5" />
              <line x1="0" y1="155" x2="0" y2="420" stroke="#7986cb" stroke-width="1" opacity="0.5" />
              <line x1="13" y1="155" x2="13" y2="420" stroke="#7986cb" stroke-width="1" opacity="0.5" />
            </g>
          </g>
          <use href="#kl-skyline-slice" x="1200" />
        </g>

        <!-- 4. MIDGROUND PARALLAX LAYER -->
        <g class="skyline-mid">
          <g id="kl-midground-slice">
            <!-- Sultan Abdul Samad Building -->
            <g transform="translate(150, 305)">
              <rect x="0" y="45" width="220" height="75" fill="#b7523d" stroke="#7f3222" stroke-width="1.5" />

                <path d="M185,120 L185,95 A10,10 0 1,1 205,95 L205,120 Z" />
              </g>
              <path d="M20,45 Q20,22 35,15 Q50,22 50,45 Z" fill="#d9822b" />
              <path d="M170,45 Q170,22 185,15 Q200,22 200,45 Z" fill="#d9822b" />
              <rect x="92" y="0" width="36" height="120" fill="#c95f49" stroke="#7f3222" stroke-width="1.5" />
              <rect x="92" y="25" width="36" height="7" fill="#f5e6d3" />
              <path d="M88,0 Q88,-28 110,-38 Q132,-28 132,0 Z" fill="#e69138" />
              <line x1="110" y1="-38" x2="110" y2="-50" stroke="#ffd54f" stroke-width="2" />
              <circle cx="110" cy="48" r="11" fill="#fff8e1" stroke="#5d4037" stroke-width="2" />
              <line x1="110" y1="48" x2="110" y2="41" stroke="#3e2723" stroke-width="1.5" />
              <line x1="110" y1="48" x2="116" y2="48" stroke="#3e2723" stroke-width="1.5" />
            </g>

            <!-- Pintasan Saloma -->

  <script>
    const skyThemes = {
      sunset: {
        stops: ['#1a1c4b', '#3b2d64', '#9e4770', '#f2855d', '#fbd07c'],
        starsOpacity: '0.75',
        sunOpacity: '0.92',
        beamOpacity: '0.24',
        cloudColor: '#ffd8be'
      },
      day: {
        stops: ['#0288d1', '#29b6f6', '#4fc3f7', '#b3e5fc', '#e1f5fe'],
        starsOpacity: '0',
        sunOpacity: '1',
        beamOpacity: '0',
        cloudColor: '#ffffff'
      },
      night: {
        stops: ['#050716', '#0a1128', '#101f42', '#1b2a4a', '#233554'],
        starsOpacity: '1',
        sunOpacity: '0.85',
        beamOpacity: '0.52',
        cloudColor: '#455a64'
      }
    };

    function setThemeMode(mode) {
      const cfg = skyThemes[mode];
      if (!cfg) return;
      for (let i = 1; i <= 5; i++) {
        document.getElementById('sky-stop-' + i).setAttribute('stop-color', cfg.stops[i - 1]);
      }
      document.getElementById('stars-layer').setAttribute('opacity', cfg.starsOpacity);
      document.getElementById('sun-disc').setAttribute('opacity', cfg.sunOpacity);
      document.getElementById('headlight-beam').setAttribute('opacity', cfg.beamOpacity);
      document.getElementById('clouds-color').setAttribute('fill', cfg.cloudColor);

      ['sunset', 'day', 'night'].forEach(m => {
        const btn = document.getElementById('btn-' + m);
        btn.classList.toggle('active', m === mode);
      });
    }

    function setSpeed(mult, label) {
      document.getElementById('kl-svg').style.setProperty('--speed-mult', mult);
      ['chill', 'cruise', 'sprint'].forEach(s => {
        const btn = document.getElementById('spd-' + s);
        btn.classList.toggle('active', s === label);
      });
    }

    function ringBell() {
      const ripple = document.getElementById('bell-ripple');
      ripple.classList.remove('bell-wave-active');
      void ripple.offsetWidth;
      ripple.classList.add('bell-wave-active');

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.12].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, ctx.currentTime + delay);
          osc.frequency.exponentialRampToValueAtTime(2637, ctx.currentTime + delay + 0.06);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.45);
        });
      } catch (e) {}
    }
  </script>
